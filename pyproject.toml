[project]
name = "filmmatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "letterboxdpy",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
